# Trustzen with MySQL. Start with: docker compose up -d
# Then open http://localhost:3000 and choose MySQL in the installer:
#   host: db   port: 3306   database: trustzen   user: trustzen   password: trustzen
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - storage:/app/storage
    depends_on:
      - db

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: trustzen
      MYSQL_USER: trustzen
      MYSQL_PASSWORD: trustzen
      MYSQL_ROOT_PASSWORD: change-me
    volumes:
      - mysql:/var/lib/mysql

volumes:
  storage:
  mysql:
