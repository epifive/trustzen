<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Bricolage"; src: url("../../app/src/fonts/bricolage-grotesque.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Instrument"; src: url("../../app/src/fonts/instrument-sans.woff2") format("woff2"); font-weight: 400 700; }
  html, body { margin: 0; width: 590px; height: 300px; overflow: hidden; }
  body {
    position: relative; font-family: "Instrument", sans-serif; color: #fff;
    background-color: #4a31ad;
    background-image:
      radial-gradient(360px 260px at 100% 0%, rgba(242, 201, 76, .25), transparent 65%),
      radial-gradient(320px 260px at 0% 100%, rgba(150, 120, 255, .5), transparent 65%),
      linear-gradient(rgba(255,255,255,.065) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.065) 1px, transparent 1px),
      linear-gradient(135deg, #5b3fc4, #3f2896);
    background-size: auto, auto, 18px 18px, 18px 18px, auto;
  }
  .left { position: absolute; left: 26px; top: 26px; width: 232px; }
  .brand { display: flex; align-items: center; gap: 9px; font-family: "Bricolage"; font-weight: 800; font-size: 25px; letter-spacing: -.02em; }
  .brand svg { width: 34px; height: 34px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.25)); }
  h1 { font-family: "Bricolage"; font-size: 25px; line-height: 1.06; margin: 16px 0 9px; letter-spacing: -.02em; font-weight: 800; }
  h1 em { font-style: normal; color: #f2c94c; }
  p { margin: 0; font-size: 11.5px; line-height: 1.45; color: rgba(255,255,255,.86); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; }
  .chips span { font-size: 9.5px; font-weight: 600; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.24); padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .stack { position: absolute; left: 276px; top: 30px; width: 300px; height: 260px; }
  .desktop { position: absolute; left: 0; top: 0; width: 300px; border-radius: 8px; overflow: hidden; box-shadow: 0 16px 36px rgba(18, 8, 60, .45); background: #fff; }
  .desktop .bar { height: 12px; background: #efedf7; display: flex; gap: 3.5px; align-items: center; padding-left: 6px; }
  .desktop .bar i { width: 4.5px; height: 4.5px; border-radius: 50%; background: #cfcadf; }
  .desktop .shot { display: block; width: 100%; }
  .phone { position: absolute; left: 222px; top: 76px; width: 86px; height: 178px; border-radius: 15px; overflow: hidden; border: 3.5px solid #17142a; background: #fff; box-shadow: 0 14px 30px rgba(18, 8, 60, .5); }
  .phone img { display: block; width: 100%; }
</style></head>
<body>
  <div class="left">
    <div class="brand">
      <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#fff"/><rect x="5.5" y="9.5" width="20" height="12.5" rx="3.5" fill="#5b3fc4"/><path d="M9.5 21.5v4.5l4.5-4.5z" fill="#5b3fc4"/><circle cx="10.5" cy="15.75" r="2.3" fill="#fff" fill-opacity=".7"/><rect x="14.5" y="13.4" width="7.5" height="1.9" rx=".95" fill="#fff" fill-opacity=".7"/><rect x="14.5" y="16.6" width="5" height="1.9" rx=".95" fill="#fff" fill-opacity=".45"/><circle cx="25" cy="8.5" r="3.6" fill="#f2c94c" stroke="#fff" stroke-width="1.6"/></svg>
      Trustzen
    </div>
    <h1>Social proof &amp; testimonial widgets <em>SaaS</em></h1>
    <p>10 conversion widgets, real store integrations, testimonials, leads, analytics and paid plans with a full admin panel.</p>
    <div class="chips"><span>Next.js 16</span><span>React 19</span><span>MySQL / SQLite</span><span>Stripe · PayPal · Razorpay</span><span>RTL</span></div>
  </div>
  <div class="stack">
    <div class="desktop"><div class="bar"><i></i><i></i><i></i></div><img class="shot" src="../raw/l1-home-hero.png"></div>
    <div class="phone"><img src="../raw/m1-home.png"></div>
  </div>
</body></html>
